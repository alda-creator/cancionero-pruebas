name: Chord model tests

on:
  pull_request:
    branches: [main]
    paths:
      - "js/chord-model.js"
      - "js/song-diagnostics.js"
      - "tests/**"
      - "index.html"
      - ".github/workflows/chord-model-tests.yml"
  push:
    branches: [main]
    paths:
      - "js/chord-model.js"
      - "js/song-diagnostics.js"
      - "tests/**"
      - ".github/workflows/chord-model-tests.yml"

jobs:
  model-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test chord model
        run: node tests/chord-model.test.js
      - name: Test song diagnostics
        run: node tests/song-diagnostics.test.js
      - name: Check inline JavaScript syntax
        run: node tests/check-inline-scripts.js
