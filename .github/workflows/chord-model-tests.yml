name: Chord model tests

on:
  pull_request:
    branches: [main]
    paths:
      - "js/chord-model.js"
      - "js/key-detector.js"
      - "js/song-diagnostics.js"
      - "js/song-adapter.js"
      - "js/song-document.js"
      - "tests/**"
      - "index.html"
      - "sw.js"
      - ".github/workflows/chord-model-tests.yml"
  push:
    branches: [main]
    paths:
      - "js/chord-model.js"
      - "js/song-diagnostics.js"
      - "js/song-adapter.js"
      - "js/song-document.js"
      - "tests/**"
      - "index.html"
      - "sw.js"
      - ".github/workflows/chord-model-tests.yml"

jobs:
  model-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test chord model
        run: node tests/chord-model.test.js
      - name: Test automatic key detection
        run: node tests/key-detector.test.js
      - name: Test major and minor key UI integration
        run: node tests/key-mode-ui.test.js
      - name: Test Director repeated block navigation
        run: node tests/director-navigation.test.js
      - name: Test live song navigation scroll reset
        run: node tests/live-navigation.test.js
      - name: Test editor cancel and back gesture navigation
        run: node tests/editor-cancel-navigation.test.js
      - name: Test environment storage and cache isolation
        run: node tests/environment-isolation.test.js
      - name: Test song diagnostics
        run: node tests/song-diagnostics.test.js
      - name: Test song adapter
        run: node tests/song-adapter.test.js
      - name: Test song document
        run: node tests/song-document.test.js
      - name: Check inline JavaScript syntax
        run: node tests/check-inline-scripts.js
